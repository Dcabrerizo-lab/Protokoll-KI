name: Qualitätstest Sprachmodelle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/src/main/java/de/protokollki/engine/ProtocolGenerator.kt"
      - "app/src/main/cpp/llm_jni.cpp"
      - "app/src/test/**"
      - ".github/workflows/quality.yml"

jobs:
  llm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: premium-qwen3-4b
            url: https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_0.gguf
            ctx: 16384
            nothink: "0"
          - name: ultra-qwen3-8b
            url: https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf
            ctx: 16384
            nothink: "1"
          - name: standard-qwen3-4b-q3
            url: https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q3_K_M.gguf
            ctx: 8192
            nothink: "0"
          - name: kompakt-qwen25-1.5b
            url: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
            ctx: 8192
            nothink: "0"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Modell laden
        run: curl -fsSL -o model.gguf "${{ matrix.url }}" && ls -lh model.gguf
      - name: JNI-Bibliothek für Linux bauen
        run: bash scripts/build_host_llm.sh
      - name: sherpa-onnx (für Kompilierung)
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar
      - name: Android NDK und CMake installieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Protokoll aus Testbesprechung erzeugen
        shell: bash
        env:
          PK_LLM_LIB: ${{ github.workspace }}/build-host/libprotokollki_llm.so
          PK_MODEL: ${{ github.workspace }}/model.gguf
          PK_CTX: ${{ matrix.ctx }}
          PK_NO_THINK: ${{ matrix.nothink }}
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'de.protokollki.engine.QualityTest' -i | grep -vE '^(> Task|Skipping|Caching|Resolve|Up-to-date|file or directory)' | tail -200
