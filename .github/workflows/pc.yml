name: PC-Programm (Windows) bauen

# Baut "Protokoll KI für Windows" (Ordner pc/) als Installer, prüft ihn mit einer echten
# Testbesprechung auf einem Windows-Rechner und veröffentlicht ihn im Release "pc-latest".
# Die Handy-App (build.yml, Releases "latest"/"demo") bleibt davon unberührt.
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["pc/**", ".github/workflows/pc.yml", "app/src/main/java/de/protokollki/engine/ProtocolGenerator.kt"]
  pull_request:
    paths: ["pc/**", ".github/workflows/pc.yml"]

permissions:
  contents: write

concurrency:
  group: pc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pc/requirements.txt

      - name: Abhängigkeiten
        working-directory: pc
        run: python -m pip install -r requirements.txt

      - name: Unit-Tests (u. a. Prompts wortgleich mit der App)
        working-directory: pc
        run: python -m pytest -q tests

      - name: llama-server (llama.cpp) für Windows holen
        working-directory: pc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p build/llama dl
          TAG=$(gh release view -R ggml-org/llama.cpp --json tagName -q .tagName)
          echo "llama.cpp $TAG"
          gh release download "$TAG" -R ggml-org/llama.cpp -D dl -p "llama-*-bin-win-cpu-x64.zip"
          gh release download "$TAG" -R ggml-org/llama.cpp -D dl -p "llama-*-bin-win-vulkan-x64.zip" || true
          for z in dl/*cpu*.zip dl/*vulkan*.zip; do [ -f "$z" ] && unzip -o -q "$z" -d build/llama; done
          # nur das Nötige behalten (Server + Bibliotheken)
          find build/llama -type f ! -name "llama-server.exe" ! -name "*.dll" -delete
          find build/llama -mindepth 2 -type f -exec mv -f {} build/llama/ \; 2>/dev/null || true
          ls -la build/llama
          ./build/llama/llama-server.exe --version || true
          echo "$TAG" > build/llama/VERSION.txt

      - name: Programmsymbol
        working-directory: pc
        run: python tools/make_icon.py build/icon.ico

      - name: Programm bauen (PyInstaller)
        working-directory: pc
        run: |
          python -m PyInstaller --noconfirm --clean ProtokollKI.spec
          ls dist/ProtokollKI | head -50
          du -sh dist/ProtokollKI

      - name: Testmodelle laden (klein)
        working-directory: pc
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/models/qwen2.5-1.5b-instruct-q4_k_m.gguf" \
            https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf

      - name: Ende-zu-Ende-Test mit dem fertigen Programm (Testbesprechung)
        working-directory: pc
        env:
          PK_MODEL_SET: kompakt
          PK_CPU_ONLY: "1"
        run: |
          export PK_MODELS_DIR="$RUNNER_TEMP/models" PK_DATA_DIR="$RUNNER_TEMP/pkdata" PK_OUTPUT_DIR="$RUNNER_TEMP/out"
          export PK_CLI_OUT="$RUNNER_TEMP/result.json"
          # lädt Spracherkennung + Sprechererkennung selbst (wie beim ersten Start beim Nutzer)
          ./dist/ProtokollKI/ProtokollKI.exe --cli ../scripts/e2e/meeting.wav DIENSTBESPRECHUNG &
          PID=$!
          for i in $(seq 1 240); do [ -f "$PK_CLI_OUT" ] && break; sleep 5; done
          cat "$PK_DATA_DIR/konsole.log" 2>/dev/null | tail -40 || true
          cat "$PK_DATA_DIR/llama-server.log" 2>/dev/null | tail -20 || true
          cat "$PK_CLI_OUT"
          python - <<'EOF'
          import json, os, pathlib
          r = json.load(open(os.environ["PK_CLI_OUT"], encoding="utf-8"))
          assert "error" not in r, r
          assert r["segments"] >= 3, "zu wenig Transkript"
          assert r["speakers"] >= 2, "Sprecher nicht erkannt"
          assert len(r["tasks"]) >= 2, "Aufgaben fehlen"
          assert r["overview"].strip(), "Zusammenfassung fehlt"
          for k in ("docx", "pdf", "phone"):
              p = pathlib.Path(r["files"][k]); assert p.exists() and p.stat().st_size > 1000, k
          print("OK:", [t["text"] + " / " + t["owner"] + " / " + t["due"] for t in r["tasks"]])
          EOF

      - name: Oberfläche startet (Smoke-Test)
        working-directory: pc
        run: |
          export PK_DATA_DIR="$RUNNER_TEMP/pkdata2" PK_BROWSER=1 BROWSER=echo
          ./dist/ProtokollKI/ProtokollKI.exe --browser &
          for i in $(seq 1 30); do [ -f "$PK_DATA_DIR/instance.json" ] && break; sleep 1; done
          python - <<'EOF'
          import json, os, http.client
          info = json.load(open(os.path.join(os.environ["PK_DATA_DIR"], "instance.json")))
          c = http.client.HTTPConnection("127.0.0.1", info["port"], timeout=10)
          c.request("GET", "/?t=" + info["token"]); r = c.getresponse(); body = r.read().decode()
          assert r.status == 200 and "Protokoll KI" in body, r.status
          c.request("GET", "/api/state", headers={"X-Token": info["token"]}); s = json.loads(c.getresponse().read())
          assert "meetings" in s
          c.request("GET", "/api/state"); assert c.getresponse().status == 403   # ohne Schlüssel kein Zugriff
          print("Oberfläche OK, Version", s["version"])
          EOF
          taskkill //F //IM ProtokollKI.exe || true

      - name: Installer bauen (Inno Setup)
        working-directory: pc
        run: |
          export PK_VERSION="1.0.${GITHUB_RUN_NUMBER}"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ProtokollKI-PC-Setup
          path: pc/dist/ProtokollKI-PC-Setup.exe

      - name: Release "pc-latest" aktualisieren
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pc-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create pc-latest pc/dist/ProtokollKI-PC-Setup.exe --target "$GITHUB_SHA" --latest=false \
            --title "Protokoll KI für Windows (Build ${GITHUB_RUN_NUMBER})" \
            --notes "Installer für Windows 10/11. Herunterladen, öffnen, fertig (keine Administratorrechte nötig). Beim ersten Start lädt das Programm einmalig die KI, danach läuft alles offline. Hinweis: Windows fragt evtl. nach („Weitere Informationen“ → „Trotzdem ausführen“), weil der Installer nicht kostenpflichtig signiert ist."
