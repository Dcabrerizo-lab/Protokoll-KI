name: PC-Programm (Windows + Linux) bauen

# Baut "Protokoll KI" für den PC (Ordner pc/): Windows-Installer, Linux .deb und AppImage.
# Prüft jedes Paket mit einer echten Testbesprechung und veröffentlicht alles im Release "pc-latest".
# Die Handy-App (build.yml, Releases "latest"/"demo") bleibt davon unberührt.
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["pc/**", ".github/workflows/pc.yml", "app/src/main/java/de/protokollki/engine/ProtocolGenerator.kt",
            "app/src/main/assets/legal/**"]
  pull_request:
    paths: ["pc/**", ".github/workflows/pc.yml", "app/src/main/assets/legal/**"]

permissions:
  contents: write

concurrency:
  group: pc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pc/requirements.txt

      - name: Abhängigkeiten
        working-directory: pc
        run: python -m pip install -r requirements.txt

      - name: Unit-Tests (u. a. Prompts wortgleich mit der App)
        working-directory: pc
        run: python -m pytest -q tests

      - name: llama-server (llama.cpp) für Windows holen
        working-directory: pc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/get_llama.py build/llama
          ./build/llama/llama-server.exe --version || true

      - name: Programmsymbol
        working-directory: pc
        run: python tools/make_icon.py build/icon.ico

      - name: Programm bauen (PyInstaller)
        working-directory: pc
        run: |
          python -m PyInstaller --noconfirm --clean ProtokollKI.spec
          ls dist/ProtokollKI | head -50
          du -sh dist/ProtokollKI

      - name: Testmodelle laden (klein)
        working-directory: pc
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/models/qwen2.5-1.5b-instruct-q4_k_m.gguf" \
            https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf

      - name: Ende-zu-Ende-Test mit dem fertigen Programm (Testbesprechung)
        working-directory: pc
        env:
          PK_MODEL_SET: kompakt
          PK_CPU_ONLY: "1"
        run: |
          export PK_MODELS_DIR="$RUNNER_TEMP/models" PK_DATA_DIR="$RUNNER_TEMP/pkdata" PK_OUTPUT_DIR="$RUNNER_TEMP/out"
          export PK_CLI_OUT="$RUNNER_TEMP/result.json"
          # lädt Spracherkennung + Sprechererkennung selbst (wie beim ersten Start beim Nutzer)
          ./dist/ProtokollKI/ProtokollKI.exe --cli ../scripts/e2e/meeting.wav DIENSTBESPRECHUNG &
          PID=$!
          for i in $(seq 1 240); do [ -f "$PK_CLI_OUT" ] && break; sleep 5; done
          cat "$PK_DATA_DIR/konsole.log" 2>/dev/null | tail -40 || true
          cat "$PK_DATA_DIR/llama-server.log" 2>/dev/null | tail -20 || true
          cat "$PK_CLI_OUT"
          python - <<'EOF'
          import json, os, pathlib
          r = json.load(open(os.environ["PK_CLI_OUT"], encoding="utf-8"))
          assert "error" not in r, r
          assert r["segments"] >= 3, "zu wenig Transkript"
          assert r["speakers"] >= 2, "Sprecher nicht erkannt"
          assert len(r["tasks"]) >= 2, "Aufgaben fehlen"
          assert r["overview"].strip(), "Zusammenfassung fehlt"
          for k in ("docx", "pdf", "phone"):
              p = pathlib.Path(r["files"][k]); assert p.exists() and p.stat().st_size > 1000, k
          print("OK:", [t["text"] + " / " + t["owner"] + " / " + t["due"] for t in r["tasks"]])
          EOF

      - name: Oberfläche startet (Smoke-Test)
        working-directory: pc
        run: |
          export PK_DATA_DIR="$RUNNER_TEMP/pkdata2" PK_BROWSER=1 BROWSER=echo
          ./dist/ProtokollKI/ProtokollKI.exe --browser &
          for i in $(seq 1 30); do [ -f "$PK_DATA_DIR/instance.json" ] && break; sleep 1; done
          python - <<'EOF'
          import json, os, http.client
          info = json.load(open(os.path.join(os.environ["PK_DATA_DIR"], "instance.json")))
          c = http.client.HTTPConnection("127.0.0.1", info["port"], timeout=10)
          c.request("GET", "/?t=" + info["token"]); r = c.getresponse(); body = r.read().decode()
          assert r.status == 200 and "Protokoll KI" in body, r.status
          c.request("GET", "/api/state", headers={"X-Token": info["token"]}); s = json.loads(c.getresponse().read())
          assert "meetings" in s
          c.request("GET", "/api/state"); assert c.getresponse().status == 403   # ohne Schlüssel kein Zugriff
          for doc in ("datenschutz", "lizenzen", "impressum"):          # Rechtstexte im Paket enthalten
              c.request("GET", "/api/legal/" + doc, headers={"X-Token": info["token"]})
              t = json.loads(c.getresponse().read())["text"]
              assert len(t) > 100 and "BITTE AUSFÜLLEN" not in t, doc
          print("Oberfläche OK, Version", s["version"])
          EOF
          taskkill //F //IM ProtokollKI.exe || true

      # Windows-Codesignatur (optional): nur wenn die Azure-Trusted-Signing-Secrets gesetzt sind.
      # Ohne Signatur zeigt Windows SmartScreen beim Installieren eine Warnung. Anleitung: docs/vertrieb/signatur.md
      - name: Signatur verfügbar?
        id: sig
        shell: bash
        env:
          AZ_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: echo "on=$([ -n "$AZ_ID" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Programm signieren
        if: steps.sig.outputs.on == '1'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: pc/dist/ProtokollKI
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Installer bauen (Inno Setup)
        working-directory: pc
        run: |
          export PK_VERSION="1.0.${GITHUB_RUN_NUMBER}"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss
          ls -la dist

      - name: Installer signieren
        if: steps.sig.outputs.on == '1'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files: ${{ github.workspace }}/pc/dist/ProtokollKI-PC-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: ProtokollKI-PC-Setup
          path: pc/dist/ProtokollKI-PC-Setup.exe

  linux:
    runs-on: ubuntu-22.04          # ältere Basis: läuft damit auch auf Ubuntu 22.04, Mint 21, Debian 12
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pc/requirements.txt

      - name: Systempakete
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 fonts-dejavu-core libvulkan1 dpkg-dev desktop-file-utils

      - name: Abhängigkeiten
        working-directory: pc
        run: python -m pip install -r requirements.txt

      - name: Unit-Tests
        working-directory: pc
        run: python -m pytest -q tests

      - name: Programm, .deb und AppImage bauen
        working-directory: pc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PK_VERSION="1.0.${GITHUB_RUN_NUMBER}"
          bash tools/build_linux.sh
          cat build/llama/VERSION.txt
          ldd build/llama/llama-server | grep -i "not found" && exit 1 || true
          ./build/llama/llama-server --list-devices || true

      - name: Testmodelle laden (klein)
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/models/qwen2.5-1.5b-instruct-q4_k_m.gguf" \
            https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf

      - name: Ende-zu-Ende-Test mit dem AppImage (Testbesprechung)
        working-directory: pc
        env:
          PK_MODEL_SET: kompakt
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          export PK_MODELS_DIR="$RUNNER_TEMP/models" PK_DATA_DIR="$RUNNER_TEMP/pkdata" PK_OUTPUT_DIR="$RUNNER_TEMP/out"
          export PK_CLI_OUT="$RUNNER_TEMP/result.json"
          timeout 40m ./dist/ProtokollKI-x86_64.AppImage --cli ../scripts/e2e/meeting.wav DIENSTBESPRECHUNG || true
          tail -20 "$PK_DATA_DIR/protokoll-ki.log" || true
          tail -20 "$PK_DATA_DIR/llama-server.log" || true
          python - <<'EOF'
          import json, os, pathlib
          r = json.load(open(os.environ["PK_CLI_OUT"], encoding="utf-8"))
          assert "error" not in r, r
          assert r["segments"] >= 3, "zu wenig Transkript"
          assert r["speakers"] >= 2, "Sprecher nicht erkannt"
          assert len(r["tasks"]) >= 2, "Aufgaben fehlen"
          assert r["overview"].strip(), "Zusammenfassung fehlt"
          for k in ("docx", "pdf", "phone"):
              p = pathlib.Path(r["files"][k]); assert p.exists() and p.stat().st_size > 1000, k
          print("OK:", [t["text"] + " / " + t["owner"] + " / " + t["due"] for t in r["tasks"]])
          EOF
          grep -h "Hardware:\|Sprachmodell gestartet" "$PK_DATA_DIR/protokoll-ki.log" || true

      - name: .deb installieren und Oberfläche prüfen (Smoke-Test)
        working-directory: pc
        run: |
          sudo apt-get install -y ./dist/protokoll-ki_*_amd64.deb
          desktop-file-validate /usr/share/applications/protokoll-ki.desktop
          test -x /usr/bin/protokoll-ki
          export PK_DATA_DIR="$RUNNER_TEMP/pkdata2" PK_BROWSER=1 BROWSER=echo
          protokoll-ki &
          for i in $(seq 1 30); do [ -f "$PK_DATA_DIR/instance.json" ] && break; sleep 1; done
          python - <<'EOF'
          import json, os, http.client
          info = json.load(open(os.path.join(os.environ["PK_DATA_DIR"], "instance.json")))
          c = http.client.HTTPConnection("127.0.0.1", info["port"], timeout=10)
          c.request("GET", "/?t=" + info["token"]); r = c.getresponse(); body = r.read().decode()
          assert r.status == 200 and "Protokoll KI" in body, r.status
          c.request("GET", "/api/state", headers={"X-Token": info["token"]}); s = json.loads(c.getresponse().read())
          assert "meetings" in s and s["platform"].startswith("linux")
          print("Erkannt:", s["models"]["hardware"], "->", s["models"]["recommended"])
          c.request("GET", "/api/devices", headers={"X-Token": info["token"]}); print("Mikrofone:", c.getresponse().read()[:200])
          c.request("GET", "/api/state"); r = c.getresponse(); r.read(); assert r.status == 403   # ohne Schlüssel kein Zugriff
          c.close(); c = http.client.HTTPConnection("127.0.0.1", info["port"], timeout=10)
          c.request("POST", "/api/quit", body="{}", headers={"X-Token": info["token"], "Content-Type": "application/json"}); c.getresponse().read()
          print("Oberfläche OK, Version", s["version"])
          EOF
          sleep 2
          ! pgrep -f /opt/protokoll-ki/ProtokollKI || (echo "Programm hat sich nicht beendet"; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: ProtokollKI-Linux
          path: |
            pc/dist/*.deb
            pc/dist/*.AppImage

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Release "pc-latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          cat > notes.md <<'EOF'
          **Windows 10/11:** `ProtokollKI-PC-Setup.exe` herunterladen, öffnen, fertig (keine Administratorrechte nötig). Windows fragt evtl. nach („Weitere Informationen“ → „Trotzdem ausführen“), weil der Installer nicht kostenpflichtig signiert ist.

          **Linux (Ubuntu, Mint, Debian):** die `.deb`-Datei herunterladen und doppelklicken (oder `sudo apt install ./protokoll-ki_*.deb`). Danach im Startmenü „Protokoll KI“.

          **Linux (alle anderen):** `ProtokollKI-x86_64.AppImage` herunterladen, Rechtsklick → Eigenschaften → „Als Programm ausführen“ erlauben, doppelklicken.

          Beim ersten Start erkennt das Programm Arbeitsspeicher und Grafikkarte, wählt selbst die schnellste Einstellung bei bester Qualität und lädt einmalig die KI. Danach läuft alles offline.
          EOF
          sed -i 's/^          //' notes.md
          gh release delete pc-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create pc-latest out/* --target "$GITHUB_SHA" --latest=false \
            --title "Protokoll KI für Windows und Linux (Build ${GITHUB_RUN_NUMBER})" --notes-file notes.md
