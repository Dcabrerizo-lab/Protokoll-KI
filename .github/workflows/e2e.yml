name: Ende-zu-Ende-Test (Emulator)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  SHERPA_VERSION: "2.0.3"

jobs:
  build:
    name: Test-App bauen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android NDK und CMake installieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: sherpa-onnx herunterladen
        run: |
          mkdir -p app/libs
          curl -fsSL --retry 5 --retry-all-errors -o app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}.aar"
      - name: Test-App und Gerätetests (x86_64) bauen
        run: |
          ./gradlew --no-daemon assembleDebug -Ppk.abis=x86_64
          ./gradlew --no-daemon assembleDebugAndroidTest -Ppk.abis=x86_64 || echo "Keine Gerätetests gebaut"
      - uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn

  models:
    name: Modelle laden (${{ matrix.set }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        set: [kompakt, standard]
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: e2e-models
          key: e2e-models-v5-${{ matrix.set }}
      - name: Herunterladen (mit Wiederholung)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          C="curl -fsSL --retry 6 --retry-all-errors --retry-delay 10"
          GH=https://github.com/k2-fsa/sherpa-onnx/releases/download
          HF=https://huggingface.co
          mkdir -p e2e-models tmp && cd tmp
          if [ "${{ matrix.set }}" = kompakt ]; then W=base; LLM=$HF/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
          else W=small; LLM=$HF/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q3_K_M.gguf; fi
          PK=sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8
          $C $GH/asr-models/$PK.tar.bz2 | tar xj
          for f in encoder.int8.onnx decoder.int8.onnx joiner.int8.onnx tokens.txt; do cp $PK/$f ../e2e-models/parakeet-$f; done
          $C $GH/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2 | tar xj
          cp sherpa-onnx-pyannote-segmentation-3-0/model.onnx ../e2e-models/pyannote-segmentation-3-0.onnx
          $C -o ../e2e-models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx $GH/speaker-recongition-models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx
          $C -o ../e2e-models/wespeaker_en_voxceleb_resnet34_LM.onnx $GH/speaker-recongition-models/wespeaker_en_voxceleb_resnet34_LM.onnx
          $C -o ../e2e-models/$(basename $LLM) $LLM
          ls -lh ../e2e-models

  emulator:
    name: ${{ matrix.name }}
    needs: [build, models]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Szenarien A · Android 14", api: 34, set: kompakt, cmd: "scenarios.sh kompakt zwei_personen drei_personen folgesitzung fallbesprechung" }
          - { name: "Szenarien B · Android 14", api: 34, set: kompakt, cmd: "scenarios.sh kompakt vereinssitzung uebergabe drei_personen_laerm drei_personen_leise" }
          - { name: "Lange Besprechung · Android 14", api: 34, set: kompakt, cmd: "scenarios.sh kompakt lang" }
          - { name: "Modell Standard · Android 14", api: 34, set: standard, ram: 8192M, cmd: "scenarios.sh standard drei_personen vereinssitzung fallbesprechung" }
          - { name: "Android 9", api: 28, set: kompakt, cmd: "scenarios.sh kompakt drei_personen" }
          - { name: "Android 11", api: 30, set: kompakt, cmd: "scenarios.sh kompakt zwei_personen uebergabe" }
          - { name: "Android 13", api: 33, set: kompakt, cmd: "scenarios.sh kompakt fallbesprechung" }
          - { name: "Android 15", api: 35, set: kompakt, cmd: "scenarios.sh kompakt drei_personen folgesitzung" }
          - { name: "Randfälle · Abbruch · Neustart", api: 34, set: kompakt, cmd: "edge.sh kompakt" }
          - { name: "Import alter Protokolle", api: 34, set: kompakt, cmd: "docs.sh kompakt" }
          - { name: "Zufalls-Klicktest · Android 14", api: 34, set: none, cmd: "monkey.sh" }
          - { name: "Zufalls-Klicktest · Android 9", api: 28, set: none, cmd: "monkey.sh" }
          - { name: "Gerätetests (schnell)", api: 34, set: none, cmd: "instrumented.sh fast" }
          - { name: "Gerätetests (mit Modellen)", api: 34, set: kompakt, cmd: "instrumented.sh models" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-apks
          path: app/build/outputs/apk
      - name: APK-Pfade ordnen
        run: |
          find app/build/outputs/apk -name "*.apk" | sort
          mkdir -p app/build/outputs/apk/debug app/build/outputs/apk/androidTest/debug
          f=$(find app/build/outputs/apk -name app-debug.apk | head -1); [ "$f" = app/build/outputs/apk/debug/app-debug.apk ] || cp "$f" app/build/outputs/apk/debug/app-debug.apk
          t=$(find app/build/outputs/apk -name app-debug-androidTest.apk | head -1); if [ -n "$t" ] && [ "$t" != app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ]; then cp "$t" app/build/outputs/apk/androidTest/debug/; fi
      - uses: actions/cache/restore@v4
        if: matrix.set != 'none'
        with:
          path: e2e-models
          key: e2e-models-v5-${{ matrix.set }}
          fail-on-cache-miss: true
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator starten und testen
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MODELS: e2e-models
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: ${{ matrix.ram || '6144M' }}
          disk-size: 10G
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/e2e/${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ strategy.job-index }}
          path: e2e-out/
